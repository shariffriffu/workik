name: json_flutter_app
description: A Flutter application with JSON-driven UI rendering.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.0.0
  
  # JSON Parsing
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  
  # HTTP Client
  http: ^1.1.0
  
  # Navigation
  go_router: ^12.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Validation
  validators: ^3.0.0
  
  # Glassmorphism
  glassmorphism: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/json/properties.json
    - assets/icons/
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
